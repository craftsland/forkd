name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo build
        run: cargo build --all
      - name: cargo test
        run: cargo test --all

  bench-python:
    # Pure-stdlib Python tests for bench/pause-window/. No firecracker
    # or daemon needed — the analyzer runs on synthetic event lists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: analyze.py unit tests
        working-directory: bench/pause-window
        run: python -m unittest test_analyze.py -v
      - name: agent / echo_server syntax
        working-directory: bench/pause-window
        run: |
          python -m py_compile agent.py
          python -m py_compile echo_server.py
      - name: run.sh shellcheck-style parse
        run: bash -n bench/pause-window/run.sh

  sdk-python:
    # SDK unit tests that need no firecracker/daemon — target parsing
    # and the _send wire protocol against an in-process socket server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install + pytest
        working-directory: sdk/python
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet -e .
          python -m pytest tests/ -q

  mcp-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp:
          - 'mcp==1.2.0'
          # Deliberately tracks the latest compatible 1.x as an early warning.
          - 'mcp>=1.2,<2'
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major tags after v7, so this
      # one is pinned to an exact release while the rest track majors.
      - uses: astral-sh/setup-uv@v9.0.0
      - name: stdio handshake
        run: >-
          uv run --isolated --no-project
          --with-editable ./sdk/mcp
          --with anyio
          --with pytest
          --with '${{ matrix.mcp }}'
          pytest -q sdk/mcp/tests/test_stdio.py
